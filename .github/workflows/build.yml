name: Verify and package
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run web:build
      - run: cargo test --workspace
      - run: cargo build -p hub-server --release
      - name: Package Windows installer with offline WebView2
        working-directory: apps/native
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-and-web
          path: |
            target/release/bundle/nsis/*.exe
            target/release/hub-server.exe
            web/dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - run: npm ci && npm --prefix web ci && npm run web:build
      - name: Generate environment-specific Tauri links
        working-directory: apps/native
        run: npx tauri android init --ci --skip-targets-install
      - name: Apply the tracked foreground service integration
        shell: pwsh
        run: ./scripts/native-sync-android.ps1
      - name: Package signed development APK for device acceptance
        working-directory: apps/native
        run: npx tauri android build --debug --target aarch64 --apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-device-testing
          path: apps/native/gen/android/app/build/outputs/apk/**/*.apk
